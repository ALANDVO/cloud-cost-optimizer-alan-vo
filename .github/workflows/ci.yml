name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: backend
          DEMO_MODE: "true"
          JWT_SECRET: "test-secret-for-ci"
        run: |
          .venv/bin/python -m pytest tests -v

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: cloud-cost-optimizer-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-docker:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: cloud-cost-optimizer-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config --quiet

  check-metadata:
    name: Check Metadata Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check portfolio.json exists
        run: test -f portfolio.json && echo "portfolio.json exists"

      - name: Check CHANGELOG.md exists
        run: test -f CHANGELOG.md && echo "CHANGELOG.md exists"

      - name: Check pyproject.toml exists
        run: test -f pyproject.toml && echo "pyproject.toml exists"

      - name: Check LICENSE exists
        run: test -f LICENSE && echo "LICENSE exists"

      - name: Validate portfolio.json schema
        run: |
          python3 -c "
          import json, sys
          with open('portfolio.json') as f:
              data = json.load(f)
          required = ['schema_version', 'name', 'owner', 'email', 'domain', 'workflows', 'auth', 'llm_providers', 'summary']
          for key in required:
              if key not in data:
                  print(f'Missing key: {key}')
                  sys.exit(1)
          if data['schema_version'] != 1:
              print('schema_version must be 1')
              sys.exit(1)
          if not isinstance(data['workflows'], list) or len(data['workflows']) < 3:
              print('workflows must be a list of at least 3 items')
              sys.exit(1)
          print('portfolio.json validation passed')
          "