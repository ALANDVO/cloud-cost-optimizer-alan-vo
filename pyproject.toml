[project]
name = "cloud-cost-optimizer-alan-vo"
version = "1.0.0"
description = "AI-powered cloud cost analysis for AWS, GCP, and Azure"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["cloud", "cost", "optimization", "finops", "aws", "gcp", "azure", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.32",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "boto3==1.35.10",
    "botocore==1.35.10",
    "google-cloud-compute==1.19.0",
    "google-cloud-monitoring==2.20.0",
    "google-cloud-billing==1.12.0",
    "azure-identity==1.17.1",
    "azure-mgmt-compute==33.0.0",
    "azure-mgmt-consumption==11.0.0",
    "azure-mgmt-monitor==7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-mock==3.14.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true